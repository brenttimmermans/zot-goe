brief:
  - "Vierentwintig uur endurance, van de start in volle zon tot de ochtendmist boven Eau Rouge. De opdracht: sfeer én actie, meteen bruikbaar voor pers en socials."
  - "Ik fotografeerde discreet aan de pitmuur en in de paddock, en zocht vooral de momenten tussen de rondes door — de vermoeide monteur, de eerste zonnestralen over het asfalt."
  - "Opgeleverd: 180 bewerkte beelden in web- en drukformaat, drie dagen na de vlag."
